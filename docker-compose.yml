# Production on a single small VM (e.g. an AWS free-tier EC2 instance).
#   1. Put GROQ_API_KEY and DOMAIN in a .env file next to this one.
#   2. docker compose up -d --build
# Caddy gets and renews a free HTTPS certificate for $DOMAIN automatically.
#
# Web and workers run as separate containers sharing one database volume, so
# each scales on its own:  docker compose up -d --scale worker=3
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      RUN_WORKERS: "false"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--workers", "2"]
    volumes:
      - app-data:/data

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    command: ["python", "-m", "backend.app.worker"]
    # Stop gives in-flight jobs time to finish; anything cut off is retried
    # automatically when its lease expires.
    stop_grace_period: 30s
    healthcheck:
      disable: true
    volumes:
      - app-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  app-data:
  caddy-data:
