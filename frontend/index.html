<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Applied before first paint so a saved preference doesn't flash the
    // wrong theme for a frame. No saved preference -> CSS falls back to
    // the OS-level prefers-color-scheme media query on its own.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (err) {
        // localStorage unavailable (private mode, etc.) — OS preference still applies via CSS.
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>Meeting Summarizer</h1>
        <button id="theme-toggle" type="button" aria-label="Switch to dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        </button>
      </div>
      <p class="subtitle">Upload a recording — get a transcript, a summary, the decisions that were made, and action items.</p>
    </header>

    <section id="upload-section">
      <form id="upload-form">
        <label id="dropzone" for="audio-input" class="dropzone">
          <input type="file" id="audio-input" class="visually-hidden" accept=".mp3,.wav,.m4a" required />
          <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V4M12 4l-4 4M12 4l4 4" />
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
          <span class="dropzone-text" id="dropzone-text">Drag &amp; drop your recording, or <span class="dropzone-link">browse</span></span>
          <span class="dropzone-hint">MP3, WAV, or M4A</span>
        </label>
        <button type="submit" id="upload-btn">Upload &amp; Summarize</button>
      </form>
      <p id="upload-error" class="error" hidden></p>
    </section>

    <section id="status-section" hidden>
      <div class="status-row">
        <span class="spinner"></span>
        <span id="status-text">Queued…</span>
      </div>
    </section>

    <section id="result-section" hidden>
      <button id="new-upload-btn" type="button">Summarize another meeting</button>

      <div class="result-header">
        <h2 id="result-title"></h2>
        <span class="badge badge-completed">Completed</span>
      </div>
      <p class="result-filename" id="result-filename"></p>

      <h3>
        <svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6" /><line x1="4" y1="12" x2="14" y2="12" /><line x1="4" y1="18" x2="18" y2="18" /></svg>
        Summary
      </h3>
      <p id="result-summary"></p>

      <h3>
        <svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M8.5 12.5l2.5 2.5 5-5" /></svg>
        Key Decisions
      </h3>
      <ul id="result-decisions"></ul>

      <h3>
        <svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" /><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" /></svg>
        Action Items
      </h3>
      <ul id="result-actions" class="action-list"></ul>

      <h3>
        <svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>
        Open Questions
      </h3>
      <ul id="result-open-questions"></ul>

      <details class="transcript-details">
        <summary>Transcript</summary>
        <p id="result-transcript"></p>
      </details>
    </section>

    <section id="error-section" hidden>
      <p class="error" id="failure-message"></p>
      <button id="retry-btn" type="button">Try again</button>
    </section>
  </div>

  <button id="history-tab" type="button" aria-label="Recent meetings">Recent&nbsp;meetings</button>
  <div id="history-overlay" hidden></div>
  <aside id="history-panel" hidden>
    <div class="history-panel-header">
      <h3>Recent meetings</h3>
      <button id="history-close-btn" type="button" aria-label="Close">&times;</button>
    </div>
    <ul id="history-list"></ul>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
