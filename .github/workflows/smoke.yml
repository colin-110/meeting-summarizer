name: Smoke test (production)

# Checks the live site end to end with the real AI: one 25-second clip,
# deleted afterwards. Runs daily and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -m live -v
        env:
          BASE_URL: https://3-7-91-183.sslip.io
          FRONTEND_URL: https://meeting-summarizer-recorder.vercel.app
